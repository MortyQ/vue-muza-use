name: Release
on:
  push:
    branches:
      - main
    paths:
      - 'packages/use-api/**'
      - 'packages/devtools/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: |
          pnpm --filter @ametie/vue-muza-devtools build
          pnpm --filter @ametie/vue-muza-use build

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/use-api
          npx semantic-release

      # devtools versions in lockstep with @ametie/vue-muza-use — it stays
      # private/unpublished, this only keeps its package.json version in sync
      # so both packages always report the same release number.
      - name: Sync devtools version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git pull --ff-only
          VERSION=$(node -p "require('./packages/use-api/package.json').version")
          node -e "
            const fs = require('fs');
            const path = './packages/devtools/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (pkg.version !== process.argv[1]) {
              pkg.version = process.argv[1];
              fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            }
          " "$VERSION"
          if ! git diff --quiet -- packages/devtools/package.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add packages/devtools/package.json
            git commit -m "chore(release): sync devtools to ${VERSION} [skip ci]"
            git push
          fi
